name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / tests, race, vet, vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability call-graph scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  swift:
    name: macOS / Swift, icon, IPC
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Typecheck AppKit app
        run: swiftc -target "$(uname -m)-apple-macosx13.0" -warnings-as-errors -typecheck ui/*.swift -framework AppKit

      - name: Validate build metadata and deterministic icon
        run: |
          plutil -lint Info.plist EZCloudManager.entitlements
          bash -n build.sh
          swift tools/generate-icon.swift
          git diff --exit-code -- assets

      - name: Build core and exercise process boundary
        run: |
          mkdir -p dist
          go build -trimpath -o dist/ezcloud ./cmd/ezcloud
          swiftc -target "$(uname -m)-apple-macosx13.0" -warnings-as-errors \
            tools/FastProcessRunnerSmoke.swift ui/FastProcessRunner.swift \
            -o "${RUNNER_TEMP}/FastProcessRunnerSmoke"
          "${RUNNER_TEMP}/FastProcessRunnerSmoke" "${GITHUB_WORKSPACE}/dist/ezcloud"

  secrets:
    name: Secrets / full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install pinned Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1

      - name: Scan every reachable commit
        run: |
          "${RUNNER_TEMP}/bin/gitleaks" detect --source . --log-opts=--all \
            --redact=100 --no-banner --verbose
